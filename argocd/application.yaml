apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: student-management
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/harathi-mutyam/student-app-cicd.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: student-management

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true

